<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Esports</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060712;color:#fff;font-family:Arial,sans-serif}button,input,select{font:inherit}
.app{max-width:440px;margin:auto;min-height:100vh;background:linear-gradient(#090a17,#05060d);padding-bottom:76px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px}.logo{font-weight:900;font-size:20px}.logo span{color:#b33cff}.wallet{padding:9px 12px;background:#16182a;border:1px solid #38304d;border-radius:12px}
main{padding:10px 16px}.hero,.card{border:1px solid #302548;background:#101323;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:radial-gradient(circle at 80% 0,#7e2cff55,transparent 45%),#101323}.hero h1{font-size:28px;margin:0 0 7px}.muted{color:#9da4b8}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(90deg,#7628ff,#c13cff);color:#fff;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{padding:18px;border-radius:16px;border:1px solid #254c8c;background:#0e1c38;cursor:pointer}.mode.red{background:#32131b;border-color:#8c2638}.mode b{display:block;font-size:17px;margin-top:25px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.stat{padding:14px;text-align:center;border:1px solid #282d43;border-radius:14px;background:#101322}.stat strong{display:block;font-size:20px}.tour{padding:15px;border:1px solid #282d43;border-radius:15px;background:#101322;margin:10px 0}.tag{font-size:11px;color:#b968ff}.join{padding:9px 13px;border:0;border-radius:9px;background:#8c36ff;color:#fff;font-weight:800}.input{width:100%;padding:13px;border:1px solid #343a55;background:#090b14;color:#fff;border-radius:10px;margin:7px 0 13px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);height:68px;background:#0d0f1cf2;border-top:1px solid #2b2e45;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav button{background:none;border:0;color:#8e95a9;font-size:11px}.nav .on{color:#b45aff}.hidden{display:none}.danger{color:#ff7283}.success{color:#54e39a}
</style>
</head>
<body><div class="app"><header><div class="logo">BATTLE <span>ESPORTS</span></div><div class="wallet" id="headWallet">₹0</div></header><main id="view"></main><nav class="nav" id="nav"></nav></div>
<script>
let token=localStorage.getItem("token"), me=null;
const $=id=>document.getElementById(id);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body&&typeof opt.body!=="string"){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function nav(){ $("nav").innerHTML=token?`<button onclick="home()">⌂<br>HOME</button><button onclick="tournaments()">🏆<br>TOURNAMENTS</button><button onclick="wallet()">💳<br>WALLET</button><button onclick="profile()">●<br>PROFILE</button>`:""; }
async function boot(){if(token){try{me=await api("/api/me");$("headWallet").textContent="₹"+me.wallet.balance}else{token=null;localStorage.removeItem("token")}}nav();token?home():login()}
function login(){ $("view").innerHTML=`<div class="hero"><h1>WELCOME BACK!</h1><p class="muted">Login to continue your esports journey.</p></div><div class="card"><label>Email</label><input id="email" class="input" type="email" placeholder="Enter Gmail"><label>Password</label><input id="pass" class="input" type="password" placeholder="Enter password"><button class="btn" onclick="doLogin()">LOGIN</button><p class="muted">New player? <a href="#" onclick="register();return false">CREATE ACCOUNT</a></p><p id="err" class="danger"></p></div>`}
async function doLogin(){try{let d=await api("/api/auth/login",{method:"POST",body:{email:$("email").value,password:$("pass").value}});token=d.token;localStorage.setItem("token",token);boot()}catch(e){$("err").textContent=e.message}}
function register(){ $("view").innerHTML=`<div class="card"><h1>Create Account</h1><input id="u" class="input" placeholder="Username"><input id="e" class="input" type="email" placeholder="Gmail"><input id="p" class="input" type="password" placeholder="Password (8+ chars)"><button class="btn" onclick="doRegister()">REGISTER</button><p><a href="#" onclick="login();return false">Back to login</a></p><p id="err" class="danger"></p></div>`}
async function doRegister(){try{let d=await api("/api/auth/register",{method:"POST",body:{username:$("u").value,email:$("e").value,password:$("p").value}});token=d.token;localStorage.setItem("token",token);boot()}catch(e){$("err").textContent=e.message}}
async function home(){let ts=await api("/api/tournaments");$("view").innerHTML=`<div class="hero"><h1>COMPETE. WIN. EARN.</h1><p class="muted">Battle Royal & Clash Squad tournaments.</p><button class="btn" onclick="tournaments()">VIEW TOURNAMENTS</button></div><div class="grid"><div class="mode" onclick="tournaments()">🎯<b>Battle Royal</b><span class="muted">Solo / Squad</span></div><div class="mode red" onclick="tournaments()">⚔️<b>Clash Squad</b><span class="muted">4v4</span></div></div><h2>Upcoming</h2>${ts.slice(0,3).map(tcard).join("")}`}
function tcard(t){return `<div class="tour"><div class="row"><div><b>${t.title}</b><div class="tag">${t.mode}</div><div class="muted">Entry ₹${t.entry_fee} • Prize ₹${t.prize_pool}</div><div class="muted">${t.joined}/${t.max_players} players</div></div><button class="join" onclick="join(${t.id})">JOIN</button></div></div>`}
async function tournaments(){let ts=await api("/api/tournaments");$("view").innerHTML=`<h1>Tournaments</h1><div class="grid"><div class="mode" onclick="filterT('Battle Royal')">🎯<b>Battle Royal</b></div><div class="mode red" onclick="filterT('Clash Squad')">⚔️<b>Clash Squad</b></div></div><div id="list">${ts.map(tcard).join("")}</div>`}
async function filterT(mode){let ts=await api("/api/tournaments");$("list").innerHTML=ts.filter(t=>t.mode===mode).map(tcard).join("")}
async function join(id){try{await api("/api/tournaments/"+id+"/join",{method:"POST"});alert("Tournament joined successfully");boot()}catch(e){alert(e.message)}}
async function wallet(){let d=await api("/api/wallet");$("view").innerHTML=`<h1>Wallet</h1><div class="hero"><p class="muted">Available balance</p><h1>₹${d.wallet.balance}</h1><p class="muted">Use a verified payment gateway for deposits.</p></div><div class="card"><h2>Withdrawal</h2><input id="wa" class="input" type="number" placeholder="Amount"><select id="wm" class="input"><option>UPI</option><option>Bank</option></select><input id="wd" class="input" placeholder="UPI ID / bank destination"><button class="btn" onclick="withdraw()">REQUEST WITHDRAWAL</button></div><h2>Transactions</h2>${d.transactions.map(x=>`<div class="tour"><b>${x.type}</b><div>${x.amount>0?"+":"-"}₹${Math.abs(x.amount)} • ${x.status}</div></div>`).join("")}`}
async function withdraw(){try{await api("/api/withdrawals",{method:"POST",body:{amount:Number($("wa").value),method:$("wm").value,destination:$("wd").value}});alert("Withdrawal request submitted");wallet()}catch(e){alert(e.message)}}
async function profile(){let d=await api("/api/me");$("view").innerHTML=`<div class="card"><h1>${d.user.username}</h1><p class="muted">${d.user.email}</p><div class="grid"><div class="stat"><strong>${d.stats.matches}</strong>Matches Played</div><div class="stat"><strong>₹${d.wallet.balance}</strong>Wallet</div></div></div><div class="card"><button class="btn" onclick="logout()">LOGOUT</button></div>${d.user.role==="admin"?`<div class="card"><button class="btn" onclick="admin()">ADMIN PANEL</button></div>`:""}`}
async function admin(){if(me?.user?.role!=="admin"){me=await api("/api/me")}if(me.user.role!=="admin")return alert("Admin only");let s=await api("/api/admin/stats"),ts=await api("/api/tournaments"),ws=await api("/api/admin/withdrawals");$("view").innerHTML=`<h1>Admin Panel</h1><div class="grid"><div class="stat"><strong>${s.users}</strong>Users</div><div class="stat"><strong>${s.tournaments}</strong>Tournaments</div><div class="stat"><strong>${s.pendingWithdrawals}</strong>Pending Withdrawals</div><div class="stat"><strong>₹${s.walletLiability}</strong>Wallet Liability</div></div><div class="card"><h2>Create Tournament</h2><input id="tt" class="input" placeholder="Title"><select id="tm" class="input"><option>Battle Royal</option><option>Clash Squad</option></select><input id="te" class="input" type="number" placeholder="Entry fee"><input id="tp" class="input" type="number" placeholder="Prize pool"><input id="tc" class="input" type="number" placeholder="Max players"><input id="ts" class="input" type="datetime-local"><button class="btn" onclick="createT()">CREATE</button></div><h2>Tournaments</h2>${ts.map(t=>`<div class="tour"><div class="row"><div><b>${t.title}</b><div class="muted">${t.mode} • ₹${t.entry_fee} • ${t.status}</div></div><button class="join" onclick="deleteT(${t.id})">DELETE</button></div></div>`).join("")}<h2>Withdrawals</h2>${ws.map(w=>`<div class="tour"><b>${w.username}</b> — ₹${w.amount}<div class="muted">${w.method}: ${w.destination} • ${w.status}</div>${w.status==="pending"?`<button class="join" onclick="wdStatus(${w.id},'approved')">APPROVE</button> <button class="join" onclick="wdStatus(${w.id},'rejected')">REJECT</button>`:""}</div>`).join("")}`}
async function createT(){try{await api("/api/admin/tournaments",{method:"POST",body:{title:$("tt").value,mode:$("tm").value,entry_fee:Number($("te").value),prize_pool:Number($("tp").value),max_players:Number($("tc").value),starts_at:new Date($("ts").value).toISOString()}});admin()}catch(e){alert(e.message)}}
async function deleteT(id){if(confirm("Delete tournament?")){await api("/api/admin/tournaments/"+id,{method:"DELETE"});admin()}}
async function wdStatus(id,status){await api("/api/admin/withdrawals/"+id,{method:"PATCH",body:{status}});admin()}
function logout(){localStorage.removeItem("token");token=null;nav();login()}
boot();
</script></body></html>
